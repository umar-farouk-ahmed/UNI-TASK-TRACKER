<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Homework Tracker</title>
<style>
  :root {
    --bg: #f3f1ff;
    --surface: #ffffff;
    --subtle: #f0eefb;
    --hover: #e7e3fa;
    --text: #1e1b3a;
    --muted: #6b6890;
    --border: #e0dcf5;
    --primary: #6d4aff;
    --primary-2: #ff4fa3;
    --red: #ef4444;   --red-bg: #fee2e2;
    --orange: #f59e0b; --orange-bg: #fef3c7;
    --green: #10b981;  --green-bg: #d1fae5;
    --blue: #3b82f6;   --blue-bg: #dbeafe;
    --shadow: 0 6px 20px rgba(80, 60, 160, .10);
    --r: 16px;
  }
  [data-theme="dark"] {
    --bg: #12101f; --surface: #1c1930; --subtle: #25213d; --hover: #2e2a4d;
    --text: #f1efff; --muted: #a29fc7; --border: #342f58;
    --primary: #8b6dff;
    --red-bg: rgba(239,68,68,.18); --orange-bg: rgba(245,158,11,.18);
    --green-bg: rgba(16,185,129,.18); --blue-bg: rgba(59,130,246,.18);
    --shadow: 0 6px 20px rgba(0,0,0,.45);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 3rem;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 1.1rem; }

  /* ---------- Hero header ---------- */
  .hero {
    background: linear-gradient(120deg, #6d4aff 0%, #a23cff 50%, #ff4fa3 100%);
    color: #fff; padding: 1.4rem 0 4.2rem;
  }
  .hero-top { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: space-between; align-items: center; }
  .hero h1 { font-size: 1.6rem; font-weight: 800; letter-spacing: -.02em; }
  .hero p { opacity: .85; font-size: .9rem; }
  .actions { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: .35rem;
    padding: .5rem .95rem; border-radius: 999px; font-weight: 600; font-size: .85rem;
    transition: transform .15s, background .15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn-white { background: #fff; color: #5a35e8; }
  .btn-glass { background: rgba(255,255,255,.2); color: #fff; }
  .btn-glass:hover { background: rgba(255,255,255,.3); }
  .btn-primary { background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; }
  .btn-soft { background: var(--subtle); color: var(--text); border: 1px solid var(--border); }
  .btn-soft:hover { background: var(--hover); }
  .btn-danger { background: var(--red-bg); color: var(--red); }
  .btn-sm { padding: .3rem .7rem; font-size: .78rem; }
  .sync {
    display: inline-flex; align-items: center; gap: .4rem; padding: .35rem .75rem;
    border-radius: 999px; font-size: .75rem; font-weight: 700; background: rgba(255,255,255,.2);
  }
  .sync i { width: 8px; height: 8px; border-radius: 50%; background: #cbd5e1; display: block; }
  .sync.synced i { background: #34d399; box-shadow: 0 0 0 3px rgba(52,211,153,.35); }
  .sync.syncing i { background: #fbbf24; }
  .sync.error i { background: #f87171; }

  /* ---------- Stat cards ---------- */
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: .9rem; margin-top: -3rem; }
  @media (max-width: 800px) { .stats { grid-template-columns: repeat(2, 1fr); } }
  .stat {
    background: var(--surface); border-radius: var(--r); padding: 1rem 1.1rem;
    box-shadow: var(--shadow); border: 1px solid var(--border); position: relative; overflow: hidden;
  }
  .stat::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 5px; background: var(--accent, var(--primary)); }
  .stat-label { font-size: .78rem; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
  .stat-value { font-size: 2rem; font-weight: 800; line-height: 1.15; color: var(--accent, var(--text)); }
  .stat-sub { font-size: .78rem; color: var(--muted); }
  .bar { height: 8px; border-radius: 99px; background: var(--subtle); overflow: hidden; margin-top: .4rem; }
  .bar > span { display: block; height: 100%; border-radius: 99px; background: var(--c, var(--primary)); transition: width .35s; }

  /* ---------- Layout ---------- */
  .layout { display: grid; grid-template-columns: 270px 1fr; gap: 1.2rem; margin-top: 1.4rem; align-items: start; }
  @media (max-width: 900px) { .layout { grid-template-columns: 1fr; } }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 1rem; box-shadow: var(--shadow); }
  .panel-title { font-size: .78rem; font-weight: 800; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: .6rem; display: flex; justify-content: space-between; align-items: center; }
  .side { position: sticky; top: .8rem; }
  @media (max-width: 900px) { .side { position: static; } }

  .course-row {
    width: 100%; text-align: left; padding: .6rem .7rem; border-radius: 12px;
    border: 2px solid transparent; margin-bottom: .35rem; background: var(--subtle); display: block;
  }
  .course-row:hover { background: var(--hover); }
  .course-row.active { border-color: var(--c); background: var(--surface); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 20%, transparent); }
  .course-row-top { display: flex; align-items: center; gap: .5rem; font-weight: 700; font-size: .88rem; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--c); flex: none; }
  .course-row-top .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .course-row-top .cnt { font-size: .75rem; color: var(--muted); font-weight: 600; }

  /* ---------- Toolbar ---------- */
  .tabs { display: inline-flex; background: var(--surface); border: 1px solid var(--border); padding: 4px; border-radius: 999px; gap: 2px; }
  .tab { padding: .4rem 1rem; border-radius: 999px; font-weight: 700; font-size: .84rem; color: var(--muted); }
  .tab.active { background: linear-gradient(120deg, var(--primary), var(--primary-2)); color: #fff; }
  .toolbar { display: flex; flex-wrap: wrap; gap: .6rem; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .filters { display: flex; flex-wrap: wrap; gap: .5rem; }
  .filters select, .filters input {
    padding: .42rem .7rem; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface); font-size: .84rem;
  }
  @media (max-width: 640px) { .filters, .filters select, .filters input { width: 100%; } }

  /* ---------- Tasks ---------- */
  .group { margin-bottom: 1.2rem; }
  .group-head { display: flex; align-items: center; gap: .5rem; font-weight: 800; font-size: .92rem; margin-bottom: .5rem; }
  .pill { padding: .1rem .55rem; border-radius: 999px; font-size: .72rem; font-weight: 800; background: var(--subtle); color: var(--muted); }
  .group.g-overdue .group-head { color: var(--red); }
  .group.g-overdue .pill { background: var(--red-bg); color: var(--red); }
  .group.g-today .group-head { color: var(--orange); }
  .group.g-today .pill { background: var(--orange-bg); color: var(--orange); }

  .task {
    display: flex; gap: .8rem; align-items: flex-start; padding: .8rem .9rem;
    background: var(--surface); border: 1px solid var(--border); border-left: 6px solid var(--c);
    border-radius: 14px; margin-bottom: .5rem; box-shadow: 0 2px 6px rgba(80,60,160,.05);
  }
  .task.overdue { background: var(--red-bg); border-left-color: var(--red); }
  .task.soon { background: var(--orange-bg); border-left-color: var(--orange); }
  .task.done { opacity: .6; }
  .task.done .t-title { text-decoration: line-through; }
  .task input[type=checkbox] { width: 1.25rem; height: 1.25rem; margin-top: .15rem; accent-color: var(--primary); flex: none; cursor: pointer; }
  .t-body { flex: 1; min-width: 0; }
  .t-title { font-weight: 700; word-break: break-word; }
  .t-desc { font-size: .84rem; color: var(--muted); white-space: pre-line; word-break: break-word; margin-top: .1rem; }
  .t-meta { display: flex; flex-wrap: wrap; gap: .4rem; align-items: center; margin-top: .4rem; font-size: .76rem; color: var(--muted); }
  .tag { padding: .1rem .55rem; border-radius: 999px; font-weight: 700; font-size: .72rem; }
  .tag-course { background: var(--c); color: #fff; }
  .tag-High { background: var(--red-bg); color: var(--red); }
  .tag-Medium { background: var(--orange-bg); color: var(--orange); }
  .tag-Low { background: var(--blue-bg); color: var(--blue); }
  .tag-late { background: var(--red); color: #fff; }
  .tag-soon { background: var(--orange); color: #fff; }
  .t-actions { display: flex; flex-direction: column; gap: .35rem; align-items: stretch; flex: none; }
  .t-actions .row { display: flex; gap: .3rem; }
  .t-actions select { padding: .25rem .4rem; border-radius: 8px; border: 1px solid var(--border); background: var(--surface); font-size: .76rem; }
  @media (max-width: 640px) { .task { flex-wrap: wrap; } .t-actions { width: 100%; flex-direction: row; justify-content: flex-end; } }

  .empty { text-align: center; padding: 2rem 1rem; color: var(--muted); border: 2px dashed var(--border); border-radius: 14px; background: var(--surface); }

  /* ---------- Course cards ---------- */
  .course-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 1rem; }
  .course-card { background: var(--surface); border: 1px solid var(--border); border-top: 6px solid var(--c); border-radius: var(--r); padding: 1rem; box-shadow: var(--shadow); }
  .course-card h3 { display: flex; justify-content: space-between; align-items: center; gap: .5rem; font-size: 1.02rem; margin-bottom: .3rem; }
  .course-card .small { font-size: .78rem; color: var(--muted); display: flex; justify-content: space-between; margin-bottom: .2rem; }
  .course-card .list { margin-top: .8rem; }

  /* ---------- Calendar ---------- */
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: .55rem; }
  @media (max-width: 1000px) { .week { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); } }
  .day { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: .6rem; min-height: 130px; }
  .day.today { border: 2px solid var(--primary); background: var(--subtle); }
  .day-h { display: flex; justify-content: space-between; font-size: .78rem; font-weight: 800; text-transform: uppercase; margin-bottom: .4rem; }
  .day-h span:last-child { color: var(--muted); font-weight: 600; }
  .chip { border-left: 4px solid var(--c); background: var(--subtle); border-radius: 8px; padding: .3rem .45rem; margin-bottom: .3rem; font-size: .76rem; cursor: pointer; width: 100%; text-align: left; display: block; }
  .chip.done { opacity: .55; text-decoration: line-through; }
  .chip b { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .chip small { color: var(--muted); }

  /* ---------- Dialogs ---------- */
  dialog { border: 0; border-radius: 20px; padding: 0; width: min(540px, 94vw); background: var(--surface); color: var(--text); box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  dialog::backdrop { background: rgba(20,10,50,.55); backdrop-filter: blur(3px); }
  .dlg { padding: 1.4rem; }
  .dlg h3 { font-size: 1.2rem; margin-bottom: 1rem; }
  .fgrid { display: grid; gap: .8rem; }
  .f2 { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
  @media (max-width: 520px) { .f2 { grid-template-columns: 1fr; } }
  .field label { display: block; font-size: .8rem; font-weight: 700; margin-bottom: .25rem; }
  .field input, .field select, .field textarea { width: 100%; padding: .55rem .7rem; border: 1px solid var(--border); border-radius: 10px; background: var(--subtle); }
  .field textarea { min-height: 80px; resize: vertical; }
  .err { color: var(--red); font-size: .82rem; font-weight: 700; display: none; }
  .dlg-foot { display: flex; justify-content: flex-end; gap: .5rem; margin-top: 1.1rem; }
  .crow { display: flex; gap: .6rem; align-items: center; margin-bottom: .55rem; }
  .crow input[type=color] { width: 44px; height: 38px; padding: 2px; border-radius: 8px; border: 1px solid var(--border); background: var(--subtle); cursor: pointer; }
  .crow input[type=text] { flex: 1; padding: .5rem .7rem; border: 1px solid var(--border); border-radius: 10px; background: var(--subtle); }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="hero-top">
      <div>
        <h1>📚 Homework Tracker</h1>
        <p id="todayText"></p>
      </div>
      <div class="actions">
        <span class="sync" id="syncBadge"><i></i><span id="syncText">Connecting...</span></span>
        <button class="btn btn-white" data-action="add">+ Add Homework</button>
        <button class="btn btn-glass" data-action="courses">Courses</button>
        <button class="btn btn-glass" data-action="export">Export</button>
        <button class="btn btn-glass" data-action="import">Import</button>
        <button class="btn btn-glass" data-action="theme" id="themeBtn">Dark</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden />
      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <section class="stats" id="stats"></section>

  <div class="layout">
    <aside class="panel side">
      <div class="panel-title"><span>Courses</span><button class="btn btn-soft btn-sm" data-action="courses">Edit</button></div>
      <div id="courseList"></div>
    </aside>

    <section>
      <div class="toolbar">
        <div class="tabs" id="tabs">
          <button class="tab" data-view="list">Next Up</button>
          <button class="tab" data-view="courses">By Course</button>
          <button class="tab" data-view="calendar">Calendar</button>
        </div>
        <div class="filters" id="filters">
          <input type="search" id="searchInput" placeholder="Search..." />
          <select id="statusFilter">
            <option value="UNFINISHED">Unfinished</option>
            <option value="ALL">All</option>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Done">Done</option>
          </select>
          <select id="sortSelect">
            <option value="dueAsc">Due: nearest</option>
            <option value="dueDesc">Due: furthest</option>
            <option value="priorityDesc">Priority: high first</option>
          </select>
        </div>
      </div>
      <div id="view"></div>
    </section>
  </div>
</main>

<dialog id="hwDialog">
  <form class="dlg" id="hwForm" novalidate>
    <h3 id="hwDlgTitle">Add Homework</h3>
    <input type="hidden" id="hwId" />
    <div class="fgrid">
      <div class="field"><label for="hwCourse">Course</label><select id="hwCourse"></select></div>
      <div class="field"><label for="hwTitle">Title *</label><input id="hwTitle" type="text" placeholder="e.g. Assignment 3 - Linked Lists" /></div>
      <div class="field"><label for="hwDesc">Notes</label><textarea id="hwDesc" placeholder="Pages, link, instructions..."></textarea></div>
      <div class="f2">
        <div class="field"><label for="hwAssigned">Assigned date</label><input id="hwAssigned" type="date" /></div>
        <div class="field"><label for="hwDue">Due date *</label><input id="hwDue" type="date" /></div>
      </div>
      <div class="f2">
        <div class="field"><label for="hwStatus">Status</label>
          <select id="hwStatus"><option>Not Started</option><option>In Progress</option><option>Done</option></select></div>
        <div class="field"><label for="hwPriority">Priority</label>
          <select id="hwPriority"><option>Low</option><option selected>Medium</option><option>High</option></select></div>
      </div>
      <div class="err" id="hwErr"></div>
    </div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-soft" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<dialog id="courseDialog">
  <form class="dlg" id="courseForm">
    <h3>Your 7 Courses</h3>
    <div id="courseInputs"></div>
    <div class="dlg-foot">
      <button type="button" class="btn btn-soft" data-action="close-dialog">Cancel</button>
      <button type="submit" class="btn btn-primary">Save</button>
    </div>
  </form>
</dialog>

<script>
(() => {
  "use strict";

  const STORAGE_KEY = "uni_homework_tracker_v1";
  const THEME_KEY = "uni_homework_theme";
  const DEFAULT_COURSES = [
    { id: "c1", name: "Course 1", color: "#6d4aff" },
    { id: "c2", name: "Course 2", color: "#ec4899" },
    { id: "c3", name: "Course 3", color: "#10b981" },
    { id: "c4", name: "Course 4", color: "#f59e0b" },
    { id: "c5", name: "Course 5", color: "#ef4444" },
    { id: "c6", name: "Course 6", color: "#3b82f6" },
    { id: "c7", name: "Course 7", color: "#06b6d4" }
  ];
  const STATUSES = ["Not Started", "In Progress", "Done"];
  const PRIORITIES = ["Low", "Medium", "High"];
  const PW = { High: 3, Medium: 2, Low: 1 };

  const state = {
    courses: structuredClone(DEFAULT_COURSES),
    homework: [],
    ui: { course: "ALL", view: "list", status: "UNFINISHED", sort: "dueAsc", search: "", weekOffset: 0 }
  };

  const $ = (id) => document.getElementById(id);

  /* ---------------- Dates ---------------- */
  const pad = (n) => String(n).padStart(2, "0");
  const toISO = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const today = () => { const n = new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); };
  const parseISO = (s) => {
    const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || "");
    return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null;
  };
  const daysFromToday = (s) => {
    const d = parseISO(s);
    if (!d) return 9999;
    // Math.round handles DST shifts (23h/25h days)
    return Math.round((d - today()) / 86400000);
  };
  const fmt = (s) => {
    const d = parseISO(s);
    return d ? d.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" }) : "";
  };
  const relLabel = (s, status) => {
    if (status === "Done") return "Completed";
    const d = daysFromToday(s);
    if (d < 0) return `Overdue by ${-d} day${d === -1 ? "" : "s"}`;
    if (d === 0) return "Due today";
    if (d === 1) return "Due tomorrow";
    return `Due in ${d} days`;
  };

  /* ---------------- Safety / sanitizing ---------------- */
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const safeColor = (c, fallback) => (/^#[0-9a-f]{6}$/i.test(c) ? c : fallback);

  function sanitizeCourses(list) {
    if (!Array.isArray(list) || list.length !== 7) return null;
    return list.map((c, i) => ({
      id: DEFAULT_COURSES[i].id, // stable ids; avoids injection through imported data
      name: String(c?.name || "").trim().slice(0, 60) || `Course ${i + 1}`,
      color: safeColor(c?.color, DEFAULT_COURSES[i].color)
    }));
  }
  function sanitizeHomework(list, courses) {
    if (!Array.isArray(list)) return null;
    const ids = new Set(courses.map((c) => c.id));
    const seen = new Set();
    const out = [];
    for (const h of list) {
      if (!h || !h.title || !parseISO(h.dueDate)) continue;
      let id = String(h.id || "").replace(/[^\w-]/g, "");
      if (!id || seen.has(id)) id = newId();
      seen.add(id);
      out.push({
        id,
        courseId: ids.has(h.courseId) ? h.courseId : courses[0].id,
        title: String(h.title).slice(0, 200),
        description: String(h.description || "").slice(0, 2000),
        assignedDate: parseISO(h.assignedDate) ? h.assignedDate : "",
        dueDate: h.dueDate,
        status: STATUSES.includes(h.status) ? h.status : "Not Started",
        priority: PRIORITIES.includes(h.priority) ? h.priority : "Medium"
      });
    }
    return out;
  }
  const newId = () => "hw_" + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const course = (id) => state.courses.find((c) => c.id === id) || state.courses[0];

  /* ---------------- Storage ---------------- */
  function load() {
    try {
      const p = JSON.parse(localStorage.getItem(STORAGE_KEY) || "null");
      if (p) {
        const c = sanitizeCourses(p.courses);
        if (c) state.courses = c;
        const h = sanitizeHomework(p.homework, state.courses);
        if (h) state.homework = h;
      }
    } catch (e) { console.error("Load failed", e); }
    let theme = null;
    try { theme = localStorage.getItem(THEME_KEY); } catch (e) {}
    if (!theme) theme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
    setTheme(theme);
  }
  let pushTimer = null;
  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ courses: state.courses, homework: state.homework }));
    } catch (e) { console.error("Save failed", e); }
    clearTimeout(pushTimer);
    pushTimer = setTimeout(() => window.pushStateToCloud && window.pushStateToCloud(), 400);
  }
  // Called by the Firebase module when remote data arrives
  window.applyRemoteState = (data) => {
    const c = sanitizeCourses(data.courses);
    if (c) state.courses = c;
    const h = sanitizeHomework(data.homework, state.courses);
    if (h) state.homework = h;
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ courses: state.courses, homework: state.homework })); } catch (e) {}
    renderAll();
  };
  window.getTrackerState = () => ({ courses: state.courses, homework: state.homework });

  function setTheme(t) {
    document.documentElement.setAttribute("data-theme", t);
    $("themeBtn").textContent = t === "dark" ? "Light" : "Dark";
    try { localStorage.setItem(THEME_KEY, t); } catch (e) {}
  }

  /* ---------------- Filtering / sorting ---------------- */
  function sortList(items, mode) {
    return [...items].sort((a, b) => {
      const byDue = a.dueDate.localeCompare(b.dueDate);
      const byPri = PW[b.priority] - PW[a.priority];
      if (mode === "dueDesc") return -byDue || byPri;
      if (mode === "priorityDesc") return byPri || byDue;
      return byDue || byPri;
    });
  }
  function visible() {
    const { course: cid, status, search } = state.ui;
    const q = search.trim().toLowerCase();
    return state.homework.filter((h) => {
      if (cid !== "ALL" && h.courseId !== cid) return false;
      if (status === "UNFINISHED" && h.status === "Done") return false;
      if (status !== "ALL" && status !== "UNFINISHED" && h.status !== status) return false;
      if (q && !h.title.toLowerCase().includes(q) && !h.description.toLowerCase().includes(q)) return false;
      return true;
    });
  }

  /* ---------------- Rendering ---------------- */
  function taskHtml(h, showCourse = true) {
    const c = course(h.courseId);
    const done = h.status === "Done";
    const diff = daysFromToday(h.dueDate);
    const overdue = !done && diff < 0;
    const soon = !done && diff >= 0 && diff <= 2;
    const cls = done ? "done" : overdue ? "overdue" : soon ? "soon" : "";
    const urgency = overdue ? `<span class="tag tag-late">${esc(relLabel(h.dueDate, h.status))}</span>`
      : soon ? `<span class="tag tag-soon">${esc(relLabel(h.dueDate, h.status))}</span>` : "";
    return `
    <div class="task ${cls}" style="--c:${c.color}" data-id="${esc(h.id)}">
      <input type="checkbox" data-action="toggle" ${done ? "checked" : ""} aria-label="Mark done" />
      <div class="t-body">
        <div class="t-title">${esc(h.title)}</div>
        ${h.description ? `<div class="t-desc">${esc(h.description)}</div>` : ""}
        <div class="t-meta">
          ${showCourse ? `<span class="tag tag-course">${esc(c.name)}</span>` : ""}
          <span class="tag tag-${h.priority}">${h.priority}</span>
          ${urgency}
          <span>📅 ${esc(fmt(h.dueDate))}${!urgency ? ` · ${esc(relLabel(h.dueDate, h.status))}` : ""}</span>
          ${h.assignedDate ? `<span>Assigned ${esc(fmt(h.assignedDate))}</span>` : ""}
        </div>
      </div>
      <div class="t-actions">
        <select data-action="status" aria-label="Status">
          ${STATUSES.map((s) => `<option ${s === h.status ? "selected" : ""}>${s}</option>`).join("")}
        </select>
        <div class="row">
          <button class="btn btn-soft btn-sm" data-action="edit">Edit</button>
          <button class="btn btn-danger btn-sm" data-action="delete">Delete</button>
        </div>
      </div>
    </div>`;
  }

  function renderStats() {
    const hw = state.homework;
    const total = hw.length;
    const done = hw.filter((h) => h.status === "Done").length;
    const pct = total ? Math.round((done / total) * 100) : 0;
    let overdue = 0, due0 = 0, next7 = 0;
    hw.forEach((h) => {
      if (h.status === "Done") return;
      const d = daysFromToday(h.dueDate);
      if (d < 0) overdue++;
      else if (d === 0) due0++;
      else if (d <= 7) next7++;
    });
    $("stats").innerHTML = `
      <div class="stat" style="--accent:var(--primary)">
        <div class="stat-label">Completed</div>
        <div class="stat-value">${pct}%</div>
        <div class="stat-sub">${done} of ${total} done</div>
        <div class="bar"><span style="width:${pct}%"></span></div>
      </div>
      <div class="stat" style="--accent:var(--red)"><div class="stat-label">Overdue</div><div class="stat-value">${overdue}</div><div class="stat-sub">need attention now</div></div>
      <div class="stat" style="--accent:var(--orange)"><div class="stat-label">Due today</div><div class="stat-value">${due0}</div><div class="stat-sub">finish before tonight</div></div>
      <div class="stat" style="--accent:var(--blue)"><div class="stat-label">Next 7 days</div><div class="stat-value">${next7}</div><div class="stat-sub">coming up</div></div>`;
  }

  function renderSidebar() {
    const row = (id, name, color, count, done) => `
      <button class="course-row ${state.ui.course === id ? "active" : ""}" style="--c:${color}" data-action="pick-course" data-course="${id}">
        <div class="course-row-top"><span class="dot"></span><span class="name">${esc(name)}</span><span class="cnt">${done}/${count}</span></div>
        <div class="bar"><span style="width:${count ? (done / count) * 100 : 0}%;--c:${color}"></span></div>
      </button>`;
    const all = state.homework;
    $("courseList").innerHTML =
      row("ALL", "All courses", "#6d4aff", all.length, all.filter((h) => h.status === "Done").length) +
      state.courses.map((c) => {
        const items = all.filter((h) => h.courseId === c.id);
        return row(c.id, c.name, c.color, items.length, items.filter((h) => h.status === "Done").length);
      }).join("");
  }

  function renderList() {
    const items = visible();
    if (!items.length) return `<div class="empty">Nothing here. Add homework or change the filters.</div>`;
    const buckets = [
      { key: "overdue", title: "⚠️ Overdue", test: (d) => d < 0 },
      { key: "today", title: "🔥 Today", test: (d) => d === 0 },
      { key: "tomorrow", title: "Tomorrow", test: (d) => d === 1 },
      { key: "week", title: "Next 7 days", test: (d) => d >= 2 && d <= 7 },
      { key: "later", title: "Later", test: (d) => d > 7 }
    ];
    const done = items.filter((h) => h.status === "Done");
    const open = items.filter((h) => h.status !== "Done");
    let html = buckets.map((b) => {
      const g = sortList(open.filter((h) => b.test(daysFromToday(h.dueDate))), state.ui.sort);
      if (!g.length) return "";
      return `<div class="group g-${b.key}"><div class="group-head">${b.title}<span class="pill">${g.length}</span></div>${g.map((h) => taskHtml(h)).join("")}</div>`;
    }).join("");
    if (done.length) {
      html += `<div class="group"><div class="group-head">✅ Done<span class="pill">${done.length}</span></div>${sortList(done, state.ui.sort).map((h) => taskHtml(h)).join("")}</div>`;
    }
    return html;
  }

  function renderCourses() {
    const items = visible();
    const list = state.ui.course === "ALL" ? state.courses : state.courses.filter((c) => c.id === state.ui.course);
    return `<div class="course-grid">${list.map((c) => {
      const all = state.homework.filter((h) => h.courseId === c.id);
      const done = all.filter((h) => h.status === "Done").length;
      const pct = all.length ? Math.round((done / all.length) * 100) : 0;
      const mine = sortList(items.filter((h) => h.courseId === c.id), state.ui.sort);
      return `
      <div class="course-card" style="--c:${c.color}">
        <h3><span>${esc(c.name)}</span><button class="btn btn-primary btn-sm" style="background:${c.color}" data-action="add" data-course="${c.id}">+ Add</button></h3>
        <div class="small"><span>Progress</span><span><b>${done}/${all.length}</b> (${pct}%)</span></div>
        <div class="bar"><span style="width:${pct}%"></span></div>
        <div class="list">${mine.length ? mine.map((h) => taskHtml(h, false)).join("") : `<div class="empty">${all.length ? "No match for filters." : "No homework yet."}</div>`}</div>
      </div>`;
    }).join("")}</div>`;
  }

  function renderCalendar() {
    const t = today();
    const start = new Date(t);
    start.setDate(t.getDate() - t.getDay() + state.ui.weekOffset * 7); // week starts Sunday
    const todayIso = toISO(t);
    const items = visible();
    let html = `<div class="toolbar" style="margin-bottom:.7rem">
      <b>${start.toLocaleDateString(undefined, { month: "long", day: "numeric" })} – ${new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6).toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" })}</b>
      <div class="actions">
        <button class="btn btn-soft btn-sm" data-action="week" data-d="-1">← Prev</button>
        <button class="btn btn-soft btn-sm" data-action="week" data-d="0">This week</button>
        <button class="btn btn-soft btn-sm" data-action="week" data-d="1">Next →</button>
      </div></div><div class="week">`;
    for (let i = 0; i < 7; i++) {
      const d = new Date(start.getFullYear(), start.getMonth(), start.getDate() + i);
      const iso = toISO(d);
      const day = sortList(items.filter((h) => h.dueDate === iso), "priorityDesc");
      html += `<div class="day ${iso === todayIso ? "today" : ""}">
        <div class="day-h"><span>${d.toLocaleDateString(undefined, { weekday: "short" })}</span><span>${d.toLocaleDateString(undefined, { month: "short", day: "numeric" })}</span></div>
        ${day.map((h) => { const c = course(h.courseId); return `<button class="chip ${h.status === "Done" ? "done" : ""}" style="--c:${c.color}" data-action="edit" data-id="${esc(h.id)}"><b>${esc(h.title)}</b><small>${esc(c.name)}</small></button>`; }).join("") || `<small style="color:var(--muted)">Free</small>`}
      </div>`;
    }
    return html + "</div>";
  }

  function renderAll() {
    $("todayText").textContent = "Today is " + today().toLocaleDateString(undefined, { weekday: "long", year: "numeric", month: "long", day: "numeric" });
    renderStats();
    renderSidebar();
    document.querySelectorAll("#tabs .tab").forEach((b) => b.classList.toggle("active", b.dataset.view === state.ui.view));
    $("filters").style.display = "flex";
    $("view").innerHTML = state.ui.view === "list" ? renderList() : state.ui.view === "courses" ? renderCourses() : renderCalendar();
  }

  /* ---------------- Dialogs ---------------- */
  function fillCourseSelect() {
    $("hwCourse").innerHTML = state.courses.map((c) => `<option value="${c.id}">${esc(c.name)}</option>`).join("");
  }
  function openHw(id, preCourse) {
    fillCourseSelect();
    const h = id ? state.homework.find((x) => x.id === id) : null;
    $("hwDlgTitle").textContent = h ? "Edit Homework" : "Add Homework";
    $("hwId").value = h ? h.id : "";
    $("hwCourse").value = h ? h.courseId : (preCourse || (state.ui.course !== "ALL" ? state.ui.course : state.courses[0].id));
    $("hwTitle").value = h ? h.title : "";
    $("hwDesc").value = h ? h.description : "";
    $("hwAssigned").value = h ? h.assignedDate : toISO(today());
    $("hwDue").value = h ? h.dueDate : toISO(today());
    $("hwStatus").value = h ? h.status : "Not Started";
    $("hwPriority").value = h ? h.priority : "Medium";
    $("hwErr").style.display = "none";
    $("hwDialog").showModal();
    $("hwTitle").focus();
  }
  function openCourses() {
    $("courseInputs").innerHTML = state.courses.map((c, i) => `
      <div class="crow"><b style="width:24px">#${i + 1}</b>
        <input type="color" id="cc_${c.id}" value="${c.color}" />
        <input type="text" id="cn_${c.id}" value="${esc(c.name)}" maxlength="60" /></div>`).join("");
    $("courseDialog").showModal();
  }

  $("hwForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const title = $("hwTitle").value.trim();
    const due = $("hwDue").value;
    const assigned = $("hwAssigned").value;
    const err = $("hwErr");
    if (!title || !due) { err.textContent = "Title and due date are required."; err.style.display = "block"; return; }
    if (assigned && assigned > due) { err.textContent = "Due date can't be before the assigned date."; err.style.display = "block"; return; }
    const data = {
      courseId: $("hwCourse").value, title, description: $("hwDesc").value.trim(),
      assignedDate: assigned, dueDate: due, status: $("hwStatus").value, priority: $("hwPriority").value
    };
    const id = $("hwId").value;
    if (id) Object.assign(state.homework.find((h) => h.id === id) || {}, data);
    else state.homework.push({ id: newId(), ...data });
    save(); $("hwDialog").close(); renderAll();
  });

  $("courseForm").addEventListener("submit", (e) => {
    e.preventDefault();
    state.courses.forEach((c, i) => {
      c.name = $("cn_" + c.id).value.trim() || `Course ${i + 1}`;
      c.color = safeColor($("cc_" + c.id).value, c.color);
    });
    save(); $("courseDialog").close(); renderAll();
  });

  // click outside dialog closes it
  ["hwDialog", "courseDialog"].forEach((id) => {
    $(id).addEventListener("click", (e) => { if (e.target === $(id)) $(id).close(); });
  });

  /* ---------------- Import / export ---------------- */
  function exportJson() {
    const blob = new Blob([JSON.stringify({ exportedAt: new Date().toISOString(), courses: state.courses, homework: state.homework }, null, 2)], { type: "application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `homework-backup-${toISO(today())}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }
  $("importFile").addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        const c = sanitizeCourses(d.courses);
        const h = c && sanitizeHomework(d.homework, c);
        if (!c || !h) { alert("Invalid backup file."); return; }
        if (!confirm(`Replace current data with ${h.length} homework items from this file?`)) return;
        state.courses = c; state.homework = h;
        save(); renderAll();
      } catch { alert("Could not read that JSON file."); }
      finally { e.target.value = ""; }
    };
    r.readAsText(file);
  });

  /* ---------------- Events (delegated; no inline handlers) ---------------- */
  const taskId = (el) => el.closest("[data-id]")?.dataset.id;

  document.addEventListener("click", (e) => {
    const tab = e.target.closest("#tabs .tab");
    if (tab) { state.ui.view = tab.dataset.view; renderAll(); return; }
    const el = e.target.closest("[data-action]");
    if (!el || el.tagName === "SELECT" || el.type === "checkbox") return;
    const a = el.dataset.action;
    if (a === "add") openHw(null, el.dataset.course);
    else if (a === "courses") openCourses();
    else if (a === "export") exportJson();
    else if (a === "import") $("importFile").click();
    else if (a === "theme") setTheme(document.documentElement.dataset.theme === "dark" ? "light" : "dark");
    else if (a === "close-dialog") el.closest("dialog").close();
    else if (a === "pick-course") { state.ui.course = el.dataset.course; renderAll(); }
    else if (a === "edit") openHw(taskId(el));
    else if (a === "delete") {
      const h = state.homework.find((x) => x.id === taskId(el));
      if (h && confirm(`Delete "${h.title}"?`)) { state.homework = state.homework.filter((x) => x.id !== h.id); save(); renderAll(); }
    } else if (a === "week") {
      const d = +el.dataset.d;
      state.ui.weekOffset = d === 0 ? 0 : state.ui.weekOffset + d;
      renderAll();
    }
  });

  document.addEventListener("change", (e) => {
    const el = e.target;
    const a = el.dataset?.action;
    if (a === "toggle" || a === "status") {
      const h = state.homework.find((x) => x.id === taskId(el));
      if (!h) return;
      if (a === "toggle") h.status = el.checked ? "Done" : (h.status === "Done" ? "Not Started" : h.status);
      else h.status = STATUSES.includes(el.value) ? el.value : h.status;
      save(); renderAll();
    }
  });

  $("statusFilter").addEventListener("change", (e) => { state.ui.status = e.target.value; renderAll(); });
  $("sortSelect").addEventListener("change", (e) => { state.ui.sort = e.target.value; renderAll(); });
  $("searchInput").addEventListener("input", (e) => { state.ui.search = e.target.value; renderAll(); });

  /* ---------------- Init ---------------- */
  load();
  renderAll();
  // refresh when the day rolls over while the tab stays open
  let lastDay = toISO(today());
  setInterval(() => { const n = toISO(today()); if (n !== lastDay) { lastDay = n; renderAll(); } }, 60000);
})();
</script>

<!-- Firebase sync. If the CDN fails, the app keeps working locally. -->
<script type="module">
  const badge = document.getElementById("syncBadge");
  const text = document.getElementById("syncText");
  const setBadge = (cls, label) => {
    badge.classList.remove("synced", "syncing", "error");
    if (cls) badge.classList.add(cls);
    text.textContent = label;
  };

  try {
    const { initializeApp } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js");
    const { getFirestore, doc, setDoc, onSnapshot } = await import("https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js");

    const app = initializeApp({
      apiKey: "AIzaSyBwVk_6M8XlbBCammfSRPf-qrTYlcQZ_vE",
      authDomain: "uni-homework-tracker.firebaseapp.com",
      projectId: "uni-homework-tracker",
      storageBucket: "uni-homework-tracker.firebasestorage.app",
      messagingSenderId: "710543230892",
      appId: "1:710543230892:web:f44ae37da3250aacfb1c09",
      measurementId: "G-PTXZHXEY98"
    });
    const db = getFirestore(app);
    const ref = doc(db, "homeworkTrackers", "my_uni_tracker_2026_secret");

    window.pushStateToCloud = async () => {
      setBadge("syncing", "Syncing...");
      try {
        const s = window.getTrackerState();
        await setDoc(ref, { courses: s.courses, homework: s.homework, updatedAt: new Date().toISOString() });
        setBadge("synced", "Cloud synced");
      } catch (err) {
        console.error("Push failed:", err);
        setBadge("error", "Offline / check rules");
      }
    };

    let first = true;
    onSnapshot(ref, (snap) => {
      // ignore echoes of our own pending writes
      if (snap.metadata.hasPendingWrites) return;
      if (snap.exists()) {
        window.applyRemoteState(snap.data());
        setBadge("synced", "Cloud synced");
      } else if (first) {
        window.pushStateToCloud(); // first run: upload local data
      }
      first = false;
    }, (err) => {
      console.error("Listener error:", err);
      setBadge("error", "Offline / check rules");
    });
  } catch (err) {
    console.error("Firebase failed to load:", err);
    setBadge("error", "Local only (no cloud)");
  }
</script>
</body>
